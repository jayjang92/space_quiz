<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Exploration Quiz</title>
<style>
  :root {
    --bg1: #0b0d2b;
    --bg2: #2a1052;
    --card: #161a45;
    --text: #f5f7ff;
    --muted: #c3c8f0;
    --accent: #ffcc33;
    --accent2: #4fd1ff;
    --pink: #ff5fa2;
    --good: #2ee59d;
    --bad: #ff6b6b;
    --focus: #ffe066;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow-x: hidden;
  }
  .stars, .stars::after {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, #ffd, transparent),
      radial-gradient(1px 1px at 40% 80%, #aef, transparent),
      radial-gradient(2px 2px at 85% 65%, #fcf, transparent),
      radial-gradient(1px 1px at 10% 90%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 50%, #fff, transparent);
    background-size: 300px 300px;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  .stars::after { content: ""; background-size: 450px 450px; animation-delay: 3s; }
  @keyframes twinkle { from { opacity: .4; } to { opacity: 1; } }

  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 680px;
    background: var(--card);
    border: 2px solid #3b3f8f;
    border-radius: 20px;
    padding: 1.75rem;
    box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 30px rgba(79,209,255,.15);
  }
  h1 {
    margin: 0 0 .25rem;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    background: linear-gradient(90deg, var(--accent), var(--pink), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { line-height: 1.5; }
  .muted { color: var(--muted); }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-weight: 600; margin-bottom: .5rem; }
  .score { color: var(--accent); }
  .progress {
    height: 14px; background: #0c0f33; border-radius: 999px; overflow: hidden;
    border: 1px solid #3b3f8f; margin-bottom: 1.5rem;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--pink), var(--accent));
    transition: width .5s ease;
  }

  h2 { font-size: 1.3rem; margin: 0 0 1rem; line-height: 1.4; }
  h2:focus { outline: none; }
  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  .option {
    width: 100%; text-align: left;
    font: inherit; font-size: 1.05rem; color: var(--text);
    background: #23286a; border: 2px solid #4a50b0; border-radius: 12px;
    padding: .9rem 1rem; cursor: pointer;
    display: flex; align-items: center; gap: .75rem;
    box-shadow: 0 4px 0 #0c0f33;
    transition: transform .12s ease, box-shadow .12s ease,
                background-color .4s ease, border-color .4s ease, opacity .4s ease;
  }
  .option:hover:not(:disabled) { background: #2f3590; border-color: var(--accent2); transform: translateY(-2px); box-shadow: 0 6px 0 #0c0f33; }
  .option:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0c0f33; background: #283080; }
  .option:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 3px;
    box-shadow: 0 4px 0 #0c0f33, 0 0 0 6px rgba(255,224,102,.35);
  }
  .option .letter { transition: background-color .4s ease; }
  .option:disabled { cursor: default; opacity: .75; }
  .letter {
    flex: none; width: 2rem; height: 2rem; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700;
    background: var(--accent2); color: #0b0d2b;
  }
  .option.correct { background: #0f4d3a; border-color: var(--good); opacity: 1; animation: pop .5s ease; }
  .option.correct .letter { background: var(--good); }
  .option.incorrect { background: #5a1a2a; border-color: var(--bad); opacity: 1; animation: shake .5s ease; }
  .option.incorrect .letter { background: var(--bad); }
  .mark { margin-left: auto; font-weight: 700; }

  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }

  .feedback {
    min-height: 3.2rem; margin: 1rem 0 0; padding: .75rem 1rem; border-radius: 12px;
    font-weight: 600; display: none;
  }
  .feedback.show { display: block; animation: slideIn .4s ease; }
  .feedback.good { background: rgba(46,229,157,.15); border: 2px solid var(--good); }
  .feedback.bad { background: rgba(255,107,107,.15); border: 2px solid var(--bad); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .btn {
    font: inherit; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(90deg, var(--accent), #ff9f43);
    color: #1a1033; border: none; border-radius: 999px;
    padding: .8rem 1.6rem; cursor: pointer; margin-top: 1.25rem;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,204,51,.4); }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .hidden { display: none !important; }
  .center { text-align: center; }
  .big-emoji { font-size: 4rem; display: inline-block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .final-score { font-size: 2.5rem; font-weight: 800; color: var(--accent); margin: .5rem 0; }
  .review { text-align: left; list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .5rem; }
  .review li { padding: .6rem .8rem; border-radius: 10px; background: #1e2260; border-left: 5px solid var(--good); }
  .review li.wrong { border-left-color: var(--bad); }
  .answers-list { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: 1rem; }
  .answer-item { padding: 1rem; border-radius: 12px; background: #1e2260; border-left: 5px solid var(--good); }
  .answer-item.wrong { border-left-color: var(--bad); }
  .answer-item h2 { font-size: 1.1rem; margin: 0 0 .6rem; }
  .answer-options { list-style: none; padding: 0; margin: 0 0 .6rem; display: grid; gap: .35rem; }
  .answer-options li { padding: .4rem .6rem; border-radius: 8px; border: 2px solid transparent; }
  .answer-options li.is-correct { border-color: var(--good); background: rgba(46,229,157,.12); }
  .answer-options li.is-wrong { border-color: var(--bad); background: rgba(255,107,107,.12); }
  .answer-tag { font-weight: 700; margin-left: .4rem; }
  .answer-status { font-weight: 700; margin: .25rem 0; }
  .answer-fact { color: var(--muted); margin: .25rem 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<main>
  <!-- Start screen -->
  <section id="start" aria-labelledby="start-title" class="center">
    <span class="big-emoji" aria-hidden="true">🚀</span>
    <h1 id="start-title">Space Exploration Quiz</h1>
    <p class="muted">Test your knowledge of the cosmos with 10 questions. Ready for liftoff?</p>
    <button class="btn" id="start-btn" type="button">Start Quiz</button>
  </section>

  <!-- Quiz screen -->
  <section id="quiz" class="hidden" aria-label="Quiz">
    <div class="topbar">
      <span id="counter">Question 1 of 10</span>
      <span class="score" id="score">Score: 0</span>
    </div>
    <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <h2 id="question" tabindex="-1"></h2>
    <ul class="options" id="options" aria-labelledby="question"></ul>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <button class="btn hidden" id="next-btn" type="button">Next Question</button>
  </section>

  <!-- Results screen -->
  <section id="results" class="hidden center" aria-labelledby="results-title">
    <span class="big-emoji" id="result-emoji" aria-hidden="true">🏆</span>
    <h1 id="results-title" tabindex="-1">Mission Complete!</h1>
    <p class="final-score" id="final-score"></p>
    <p id="result-msg" class="muted"></p>
    <h2>Mission Log</h2>
    <ol class="review" id="review"></ol>
    <button class="btn" id="review-btn" type="button" lang="ko">답안 리뷰 보기</button>
    <button class="btn" id="restart-btn" type="button">Play Again</button>
  </section>

  <!-- Answer review screen -->
  <section id="answers" class="hidden" lang="ko" aria-labelledby="answers-title">
    <h1 id="answers-title" tabindex="-1">답안 리뷰</h1>
    <p id="answers-summary" class="muted"></p>
    <button class="btn back-btn" type="button">결과로 돌아가기</button>
    <ol class="answers-list" id="answers-list"></ol>
    <div class="actions">
      <button class="btn back-btn" type="button">결과로 돌아가기</button>
      <button class="btn" id="answers-restart-btn" type="button">다시 하기</button>
    </div>
  </section>
</main>

<script>
  const questions = [
    { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1,
      fact: "Iron oxide (rust) on its surface gives Mars its reddish color." },
    { q: "Who was the first human to walk on the Moon?", options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"], answer: 2,
      fact: "Neil Armstrong stepped onto the Moon on July 20, 1969, during Apollo 11." },
    { q: "What is the largest planet in our solar system?", options: ["Saturn", "Neptune", "Earth", "Jupiter"], answer: 3,
      fact: "Jupiter is more than twice as massive as all the other planets combined." },
    { q: "Who was the first human to travel into space?", options: ["Yuri Gagarin", "Alan Shepard", "Valentina Tereshkova", "Neil Armstrong"], answer: 0,
      fact: "Yuri Gagarin orbited Earth aboard Vostok 1 on April 12, 1961." },
    { q: "Which space telescope launched in 2021 to observe the universe in infrared?", options: ["Hubble", "Kepler", "James Webb", "Spitzer"], answer: 2,
      fact: "The James Webb Space Telescope orbits near the Sun–Earth L2 point." },
    { q: "Approximately how long does sunlight take to reach Earth?", options: ["8 seconds", "8 minutes", "8 hours", "8 days"], answer: 1,
      fact: "Light from the Sun takes about 8 minutes and 20 seconds to reach us." },
    { q: "Which planet has the most prominent ring system?", options: ["Uranus", "Saturn", "Mars", "Venus"], answer: 1,
      fact: "Saturn's rings are made mostly of ice particles with some rock and dust." },
    { q: "What is the name of NASA's rover that landed on Mars in 2021?", options: ["Curiosity", "Spirit", "Opportunity", "Perseverance"], answer: 3,
      fact: "Perseverance carried Ingenuity, the first helicopter to fly on another planet." },
    { q: "What galaxy is our solar system part of?", options: ["Andromeda", "Milky Way", "Triangulum", "Whirlpool"], answer: 1,
      fact: "The Milky Way contains an estimated 100–400 billion stars." },
    { q: "Which is the hottest planet in our solar system?", options: ["Mercury", "Venus", "Mars", "Jupiter"], answer: 1,
      fact: "Venus's thick CO₂ atmosphere traps heat, making it hotter than Mercury." }
  ];

  const $ = id => document.getElementById(id);
  const screens = { start: $("start"), quiz: $("quiz"), results: $("results"), answers: $("answers") };
  const letters = ["A", "B", "C", "D"];
  let current = 0, score = 0, history = [];

  function show(name) {
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
  }

  function updateProgress(done) {
    const pct = (done / questions.length) * 100;
    $("progress-fill").style.width = pct + "%";
    $("progress").setAttribute("aria-valuenow", done);
    $("progress").setAttribute("aria-valuetext", `${done} of ${questions.length} answered`);
  }

  function startQuiz() {
    current = 0; score = 0; history = [];
    $("score").textContent = "Score: 0";
    show("quiz");
    renderQuestion();
  }

  function renderQuestion() {
    const item = questions[current];
    $("counter").textContent = `Question ${current + 1} of ${questions.length}`;
    $("question").textContent = item.q;
    updateProgress(current);

    const list = $("options");
    list.innerHTML = "";
    item.options.forEach((text, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.innerHTML = `<span class="letter" aria-hidden="true">${letters[i]}</span><span class="text"></span><span class="mark" aria-hidden="true"></span>`;
      btn.querySelector(".text").textContent = text;
      btn.setAttribute("aria-label", `${letters[i]}: ${text}`);
      btn.addEventListener("click", () => choose(i));
      li.appendChild(btn);
      list.appendChild(li);
    });

    const fb = $("feedback");
    fb.className = "feedback";
    fb.textContent = "";
    $("next-btn").classList.add("hidden");
    $("question").focus();
  }

  function choose(index) {
    const item = questions[current];
    const buttons = [...$("options").querySelectorAll(".option")];
    const isCorrect = index === item.answer;
    buttons.forEach(b => b.disabled = true);

    const correctBtn = buttons[item.answer];
    correctBtn.classList.add("correct");
    correctBtn.querySelector(".mark").textContent = "✓ Correct";
    if (!isCorrect) {
      buttons[index].classList.add("incorrect");
      buttons[index].querySelector(".mark").textContent = "✗ Your answer";
    } else {
      score++;
      $("score").textContent = `Score: ${score}`;
    }

    history.push({ q: item.q, correct: isCorrect, answer: item.options[item.answer], chosen: item.options[index], chosenIndex: index });
    updateProgress(current + 1);

    const fb = $("feedback");
    fb.className = "feedback show " + (isCorrect ? "good" : "bad");
    fb.textContent = isCorrect
      ? `🎉 Correct! ${item.fact}`
      : `❌ Not quite. The answer is ${item.options[item.answer]}. ${item.fact}`;

    const next = $("next-btn");
    next.textContent = current === questions.length - 1 ? "See Results" : "Next Question";
    next.classList.remove("hidden");
    next.focus();
  }

  function nextQuestion() {
    current++;
    if (current < questions.length) renderQuestion();
    else showResults();
  }

  function showResults() {
    show("results");
    const pct = Math.round((score / questions.length) * 100);
    $("final-score").textContent = `${score} / ${questions.length} (${pct}%)`;
    let emoji, msg;
    if (pct === 100) { emoji = "🏆"; msg = "Perfect score! You're ready to command a starship."; }
    else if (pct >= 70) { emoji = "🌟"; msg = "Stellar work, astronaut! Your knowledge is out of this world."; }
    else if (pct >= 40) { emoji = "🛰️"; msg = "Solid orbit! A bit more training and you'll reach the stars."; }
    else { emoji = "🌑"; msg = "Houston, we have a problem. Try again to boost your score!"; }
    $("result-emoji").textContent = emoji;
    $("result-msg").textContent = msg;

    const review = $("review");
    review.innerHTML = "";
    history.forEach(h => {
      const li = document.createElement("li");
      if (!h.correct) li.classList.add("wrong");
      li.textContent = h.correct
        ? `✓ ${h.q} — ${h.answer}`
        : `✗ ${h.q} — You chose ${h.chosen}; correct: ${h.answer}`;
      review.appendChild(li);
    });
    $("results-title").focus();
  }

  // Question data is English inside the Korean review screen.
  function en(text) {
    const span = document.createElement("span");
    span.lang = "en";
    span.textContent = text;
    return span;
  }

  function showAnswers() {
    show("answers");
    const right = history.filter(h => h.correct).length;
    $("answers-summary").textContent = `${questions.length}문제 중 ${right}개 정답, ${history.length - right}개 오답`;

    const list = $("answers-list");
    list.innerHTML = "";
    history.forEach((h, n) => {
      const item = questions[n];
      const li = document.createElement("li");
      li.className = "answer-item" + (h.correct ? "" : " wrong");

      const title = document.createElement("h2");
      title.append(`문제 ${n + 1}: `, en(item.q));

      const opts = document.createElement("ul");
      opts.className = "answer-options";
      item.options.forEach((text, i) => {
        const o = document.createElement("li");
        o.append(`${letters[i]}. `, en(text));
        let tag = "";
        if (i === item.answer) {
          o.className = "is-correct";
          tag = i === h.chosenIndex ? "✓ 내가 고른 답 (정답)" : "✓ 정답";
        } else if (i === h.chosenIndex) {
          o.className = "is-wrong";
          tag = "✗ 내가 고른 답";
        }
        if (tag) {
          const t = document.createElement("span");
          t.className = "answer-tag";
          t.textContent = tag;
          o.append(" ", t);
        }
        opts.appendChild(o);
      });

      const status = document.createElement("p");
      status.className = "answer-status";
      status.textContent = h.correct ? "✓ 정답입니다" : "✗ 오답입니다";

      const fact = document.createElement("p");
      fact.className = "answer-fact";
      fact.append("해설: ", en(item.fact));

      li.append(title, opts, status, fact);
      list.appendChild(li);
    });
    $("answers-title").focus();
  }

  function backToResults() {
    show("results");
    $("review-btn").focus();
  }

  $("start-btn").addEventListener("click", startQuiz);
  $("next-btn").addEventListener("click", nextQuestion);
  $("restart-btn").addEventListener("click", startQuiz);
  $("review-btn").addEventListener("click", showAnswers);
  $("answers-restart-btn").addEventListener("click", startQuiz);
  document.querySelectorAll(".back-btn").forEach(b => b.addEventListener("click", backToResults));

  document.addEventListener("keydown", e => {
    if (screens.quiz.classList.contains("hidden")) return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    const idx = letters.indexOf(e.key.toUpperCase());
    if (idx === -1) return;
    const btn = $("options").querySelectorAll(".option")[idx];
    if (btn && !btn.disabled) btn.click();
  });
</script>
</body>
</html>
